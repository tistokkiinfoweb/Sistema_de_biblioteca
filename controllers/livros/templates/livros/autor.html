{% extends "base.html" %}

{% block title %}Cadastro{% endblock %}

{% block content %}
    <h1>Cadastro de Autor</h1>
    <p>Preencha os dados do autor que deseja cadastrar</p>
    <br>
    <div>
        <form action="{{url_for('livros.autor')}}" method="post">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome">
            <br>
            <button type="submit">Cadastrar Autor</button>
        </form>
    </div>
    <a href="{{url_for('livros.livro')}}">Cadastrar livro</a>
{% endblock %}
