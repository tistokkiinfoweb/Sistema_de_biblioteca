{% extends "base.html" %}

{% block title %}Listar Livros{% endblock title %}

{% block content %}
    <h1>Listar Livros</h1>
    <ul>
        {% for livro in livros %}
            <li>{{ livro.titulo }} - {{ livro.autor.nome }}</li>
        {% endfor %}
    </ul>
    <br>
    <a href="{{url_for('livros.livro')}}">Cadastrar Mais Livros</a>
    <a href="{{url_for('index')}}">Página Inicial da Biblioteca</a>
{% endblock content %}
